<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mock School Admission Form</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f6f8; color: #1e293b; padding: 24px; max-width: 680px; margin: 0 auto; }
    h1 { font-size: 1.4rem; color: #0f2e23; margin-bottom: 6px; }
    p { font-size: 0.85rem; color: #64748b; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.875rem; font-weight: 600; color: #334155; }
    input, select, textarea { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }
    .radio-group, .checkbox-group { display: flex; gap: 16px; align-items: center; margin-top: 4px; }
    .radio-group label, .checkbox-group label { font-weight: normal; font-size: 0.85rem; }
    button[type="submit"] { background: #16654e; color: #fff; padding: 10px 20px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Student Admission Form</h1>
  <p>Please enter student and parent details accurately for processing.</p>

  <form id="admissionForm" onsubmit="handleFormSubmit(event)">
    <div class="form-group">
      <label for="student_name">Student Full Name *</label>
      <input type="text" id="student_name" name="student_name" required placeholder="Aarav Sharma">
    </div>

    <div class="form-group">
      <label for="dob">Date of Birth *</label>
      <input type="date" id="dob" name="dob" required>
    </div>

    <div class="form-group">
      <label for="gender">Gender *</label>
      <select id="gender" name="gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="email">Student Email Address *</label>
      <input type="email" id="email" name="email" required placeholder="student@example.com">
    </div>

    <div class="form-group">
      <label for="phone">Contact Phone Number *</label>
      <input type="tel" id="phone" name="phone" required placeholder="+91 9876543210">
    </div>

    <div class="form-group">
      <label for="address">Residential Address *</label>
      <textarea id="address" name="address" rows="2" required placeholder="123 Park Street"></textarea>
    </div>

    <div class="form-group">
      <label for="city">City *</label>
      <input type="text" id="city" name="city" required placeholder="Mumbai">
    </div>

    <div class="form-group">
      <label for="state">State *</label>
      <input type="text" id="state" name="state" required placeholder="Maharashtra">
    </div>

    <div class="form-group">
      <label for="pincode">Pincode / Zip Code *</label>
      <input type="text" id="pincode" name="pincode" required placeholder="400001">
    </div>

    <div class="form-group">
      <label for="father_name">Father's Name *</label>
      <input type="text" id="father_name" name="father_name" required placeholder="Vikram Sharma">
    </div>

    <div class="form-group">
      <label for="mother_name">Mother's Name *</label>
      <input type="text" id="mother_name" name="mother_name" required placeholder="Sunita Sharma">
    </div>

    <div class="form-group">
      <label for="previous_school">Previous School Attended</label>
      <input type="text" id="previous_school" name="previous_school" placeholder="Greenwood High">
    </div>

    <div class="form-group">
      <label for="grade">Applying Grade / Class *</label>
      <select id="grade" name="grade" required>
        <option value="">Select Grade</option>
        <option value="Grade 1">Grade 1</option>
        <option value="Grade 5">Grade 5</option>
        <option value="Grade 10">Grade 10</option>
      </select>
    </div>

    <div class="form-group">
      <label>Does student have allergies?</label>
      <div class="radio-group">
        <label><input type="radio" name="allergies" value="Yes"> Yes</label>
        <label><input type="radio" name="allergies" value="No" checked> No</label>
      </div>
    </div>

    <div class="form-group">
      <label>Does student require transport?</label>
      <div class="radio-group">
        <label><input type="radio" name="transport" value="Yes"> Yes</label>
        <label><input type="radio" name="transport" value="No" checked> No</label>
      </div>
    </div>

    <div class="form-group checkbox-group">
      <label><input type="checkbox" id="terms" name="terms" required> I agree to the school admission terms and conditions *</label>
    </div>

    <button type="submit" id="submitBtn">Submit Application</button>
  </form>

  <script>
    function handleFormSubmit(e) {
      e.preventDefault();
      window.dispatchEvent(new CustomEvent('autofiller:submitted'));
      window.dispatchEvent(new CustomEvent('formpilot:submitted'));
      alert('Form submitted successfully!');
    }
  </script>
</body>
</html>
